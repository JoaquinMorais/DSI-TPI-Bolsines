services:
  backend:
    build: ./backend
    ports:
      - "8020:8020"
    env_file:
      - path: .env
        required: false
    environment:
      CORS_ORIGINS: http://localhost:3020
      DATABASE_URL: sqlite+aiosqlite:////app/db/bolsines.db
      # Dentro del contenedor, localhost es el propio contenedor: la API GPS
      # de la catedra corre en el host.
      GPS_BASE_URL: ${GPS_BASE_URL:-http://host.docker.internal:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # La base SQLite persiste fuera del contenedor, en un subdirectorio propio
      # para no tapar el codigo de backend/data (seed.py).
      - bolsines-data:/app/db

  frontend:
    build: ./frontend
    ports:
      - "3020:3020"
    environment:
      # Lo usa el navegador, por eso localhost y no el nombre del servicio.
      VITE_API_URL: http://localhost:8020
    depends_on:
      - backend

volumes:
  bolsines-data:
